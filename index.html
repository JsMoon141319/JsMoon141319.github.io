<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b0e"><title>JsMoon | Technical Artist Portfolio</title><style>
:root{font-family:Inter,system-ui,"Noto Sans TC",sans-serif;color:#edf0f4;background:#0a0b0e}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:2;background:#0a0b0eea;backdrop-filter:blur(18px);border-bottom:1px solid #272a30}.nav{max-width:1180px;margin:auto;padding:19px 25px;display:flex;align-items:center;gap:20px}.brand{font-weight:800;letter-spacing:.16em;margin-right:auto}.nav a{color:#b4bac4}.nav button,.filters button{background:#191c22;color:#d4d8e0;border:1px solid #343943;padding:9px 15px;border-radius:50px}.nav button:hover,.filters button.active{background:#e6edf5;color:#0a0b0e}.wrap{max-width:1180px;margin:auto;padding:0 25px}.hero{padding:125px 0 115px;border-bottom:1px solid #242830}.eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#a7b5c9}.hero h1{font-size:clamp(48px,9vw,110px);line-height:1.02;letter-spacing:-.065em;margin:25px 0}.hero h1 span{color:#8395ac}.hero p{font-size:clamp(17px,2.2vw,22px);line-height:1.8;color:#aab1bc;max-width:710px}.hero .links{display:flex;gap:13px;margin-top:34px}.hero .links a{border:1px solid #424957;padding:12px 20px;border-radius:8px}.hero .links a:first-child{background:#e6edf5;color:#101319}.section{padding:90px 0}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:32px}.heading h2{font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;margin:8px 0}.heading p{color:#909aa9}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0 34px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.project{background:#13161b;border:1px solid #2b3038;border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s;cursor:pointer;text-align:left;color:inherit;padding:0}.project:hover{transform:translateY(-5px);border-color:#7e91a8}.art{height:220px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3b526b,#151a24 60%,#0b0e14)}.art:before{content:"";width:135px;height:135px;border:1px solid #9caec8;border-radius:50%;box-shadow:0 0 0 28px #8496af0e,0 0 0 60px #8496af0a;transform:rotate(-20deg) scaleX(.72)}.art:after{content:"JS / MOON";position:absolute;font-size:10px;letter-spacing:.4em;color:#b9c7db}.project:nth-child(2) .art{background:radial-gradient(circle at 65% 30%,#665774,#24202e 60%,#111017)}.project:nth-child(3) .art{background:radial-gradient(circle at 30% 30%,#4a6d65,#1b2a2a 60%,#101717)}.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}.info{padding:23px}.tag{color:#92a8c2;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.info h3{font-size:22px;margin:12px 0}.info p{font-size:14px;color:#a5aeba;line-height:1.7}.tools{font-size:12px;color:#7d8a9a;margin-top:20px}.about{border-top:1px solid #252a33;display:grid;grid-template-columns:1fr 1fr;gap:70px}.about p{line-height:1.9;color:#aab3c0}footer{border-top:1px solid #252a33;padding:30px 0;color:#8792a1;font-size:13px;display:flex;justify-content:space-between}.modal{border:1px solid #404753;border-radius:18px;background:#14181f;color:#e9edf3;width:min(700px,92vw);max-height:85vh;overflow:auto;padding:32px}.modal::backdrop{background:#000c;backdrop-filter:blur(8px)}.modal img{width:100%;border-radius:10px}.modal p{line-height:1.8;color:#b3bdca}.close{float:right;background:none;border:0;color:#fff;font-size:28px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.about{grid-template-columns:1fr;gap:10px}.hero{padding:85px 0}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav{gap:12px}.nav a{display:none}.art{height:245px}.section{padding:60px 0}}
 .category-section{padding:42px 0 65px;border-top:1px solid #303844}.category-section h3{font-size:clamp(30px,5vw,48px);margin:8px 0 8px;letter-spacing:-.04em}.category-section .sub{color:#95a3b5;margin-bottom:30px}.category-section .grid{margin-top:24px}  .category-description{color:#aab3c0;line-height:1.8;max-width:720px;margin:-12px 0 30px} .video-wrap{position:relative;aspect-ratio:16/9;width:100%;margin:24px 0;border-radius:12px;overflow:hidden;background:#05070b}.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0} </style></head><body><header><div class="nav"><a class="brand" href="#">JSMOON<span style="color:#8fa8c6">.</span></a><a href="#projects" data-i="navProjects">Projects</a><a href="#about" data-i="navAbout">About</a><button id="language">EN / 中</button></div></header><main><section class="hero wrap"><div class="eyebrow">Technical Artist · 3D Artist · 2D Artist</div><h1>Art meets<br><span>Technology.</span></h1><p data-i="intro">在藝術與技術之間探索新的視覺可能，專注於即時影像、互動技術與數位創作。</p><div class="links"><a href="#projects" data-i="view">探索作品</a><a href="https://github.com/JsMoon141319" target="_blank" rel="noopener">GitHub ↗</a></div></section><section id="projects" class="section wrap"><div class="heading"><div><div class="eyebrow">Selected works</div><h2 data-i="work">作品集</h2></div><p data-i="workSub">從技術實驗到視覺設計</p></div><div id="sections"></div></section><section id="about" class="section about wrap"><div><div class="eyebrow">About</div><h2 data-i="about">關於我</h2></div><div><p data-i="aboutText">我是一位跨足技術美術、3D 與 2D 創作的數位藝術工作者。這裡記錄我的作品、技術研究與創作歷程。</p><p><a href="https://github.com/JsMoon141319" target="_blank" rel="noopener">GitHub ↗</a></p></div></section></main><footer class="wrap"><span>© <span id="year"></span> JsMoon</span><span>Art × Technology</span></footer><dialog id="detail" class="modal"><button class="close" id="close" aria-label="Close">×</button><div id="detailContent"></div></dialog><script>
const i18n={zh:{navProjects:"作品",navAbout:"關於",intro:"在藝術與技術之間探索新的視覺可能，專注於即時影像、互動技術與數位創作。",view:"探索作品",work:"作品集",workSub:"從技術實驗到視覺設計",about:"關於我",aboutText:"我是一位跨足技術美術、3D 與 2D 創作的數位藝術工作者。這裡記錄我的作品、技術研究與創作歷程。",all:"全部",empty:"此分類尚無作品。",sample:"示範作品，請替換為你的內容。"},en:{navProjects:"Projects",navAbout:"About",intro:"Exploring new visual possibilities where art and technology meet, through real-time visuals, interactive systems, and digital creation.",view:"Explore work",work:"Selected Work",workSub:"From technical experiments to visual design",about:"About Me",aboutText:"I am a digital artist working across technical art, 3D and 2D creation. This space documents my projects, experiments and creative process.",all:"All",empty:"No projects in this category yet.",sample:"Sample project — replace with your own work."}};
let lang=localStorage.getItem("portfolio-lang")==="en"?"en":"zh",category="All",projects=[],categories=[];
const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=o=>typeof o==="object"&&o!==null?(o[lang]||o.zh||o.en||""):(o||"");
function render(){document.documentElement.lang=lang==="zh"?"zh-Hant":"en";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=i18n[lang][e.dataset.i]);$("#language").textContent=lang==="zh"?"EN / 中":"中 / EN";const cats=categories.length?categories.map(x=>x.id):["Technical Art","3D Art","2D Art"];$("#sections").innerHTML=cats.map((c,i)=>{const n=String(i+1).padStart(2,"0");const config=categories.find(x=>x.id===c)||{};const heading=val(config.title)||c;const sub=val(config.subtitle)||"";const desc=val(config.description)||"";const items=projects.filter(p=>p.visible!==false&&p.category===c);return '<section class="category-section" id="'+c.toLowerCase().replace(/ /g,"-")+'"><div class="eyebrow">'+n+' / CATEGORY</div><h3>'+c+'</h3><div class="sub">'+sub+'</div><div class="grid">'+(items.length?items.map(p=>'<button class="project" data-id="'+escapeHtml(p.id)+'"><div class="art">'+((p.thumbnail||youtubeThumb(p.link))?'<img src="'+escapeHtml(p.thumbnail||youtubeThumb(p.link))+'" alt="'+escapeHtml(val(p.title))+'" loading="lazy">':"")+'</div><div class="info"><div class="tag">'+escapeHtml(p.category)+'</div><h3>'+escapeHtml(val(p.title))+'</h3><p>'+escapeHtml(val(p.description))+'</p><div class="tools">'+escapeHtml((p.tools||[]).join(" · "))+'</div></div></button>').join(""):'<p>'+i18n[lang].empty+'</p>')+'</div></section>'}).join("")}
$("#language").onclick=()=>{lang=lang==="zh"?"en":"zh";localStorage.setItem("portfolio-lang",lang);render()};function youtubeId(link){try{const u=new URL(link);let id="";if(["youtube.com","www.youtube.com","m.youtube.com","music.youtube.com","youtube-nocookie.com"].includes(u.hostname)){id=u.searchParams.get("v")||"";if(!id&&/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split("/")[2]||""}else if(u.hostname==="youtu.be")id=u.pathname.split("/")[1]||"";return /^[A-Za-z0-9_-]{11}$/.test(id)?id:""}catch{return ""}}
function youtubeThumb(link){const id=youtubeId(link);return id?"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg":""}
function youtubeEmbed(link){try{const u=new URL(link);let id="";if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname)){id=u.searchParams.get("v")||"";if(!id&&u.pathname.startsWith("/shorts/"))id=u.pathname.split("/")[2];if(!id&&u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]}else if(u.hostname==="youtu.be"||u.hostname==="www.youtu.be")id=u.pathname.slice(1).split("/")[0];if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";return '<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="YouTube video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>'}catch{return ""}}
$("#sections").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const p=projects.find(x=>x.id===b.dataset.id);if(!p)return;$("#detailContent").innerHTML='<div class="tag">'+escapeHtml(p.category)+'</div><h2>'+escapeHtml(val(p.title))+'</h2><p>'+escapeHtml(val(p.description))+'</p>'+((p.images||[]).map(src=>'<p><img src="'+escapeHtml(src)+'" loading="lazy"></p>').join(""))+'<p>'+escapeHtml(val(p.content)||"")+'</p>'+youtubeEmbed(p.link)+'<p class="tools">'+escapeHtml((p.tools||[]).join(" · "))+'</p>'+(p.link?'<p><a href="'+escapeHtml(p.link)+'" target="_blank" rel="noopener">View project ↗</a></p>':"");$("#detail").showModal()};$("#close").onclick=()=>$("#detail").close();$("#year").textContent=new Date().getFullYear();Promise.all([fetch("./data/projects.json").then(r=>{if(!r.ok)throw Error("Projects failed");return r.json()}),fetch("./data/categories.json").then(r=>r.ok?r.json():[])]).then(([p,c])=>{projects=p;categories=c;render()}).catch(()=>{$("#sections").textContent="Unable to load projects."});render();
</script></body></html>
